upstream django_backend {
    server django:8000;
}

# Este archivo se incluye dentro del bloque http de nginx; por eso estas
# directivas aplican globalmente a todos los server blocks.
server_tokens off;

# Límite de peticiones al formulario público de soporte (M3).
# 5 req/min por IP con ráfaga de 3; corta el spam de scripts sin cookies.
limit_req_zone $binary_remote_addr zone=soporte_publico:10m rate=5r/m;

# HTTP → HTTPS (redirect)
server {
    listen 80;
    server_name _;
    return 301 https://$host:6060$request_uri;
}

# HTTPS interno (autofirmado, LAN)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Headers de seguridad.
    # X-Content-Type-Options, X-Frame-Options y Referrer-Policy los envía
    # Django para las respuestas dinámicas; aquí se dejan solo para static/media.
    # X-XSS-Protection y HSTS los añade nginx para todo el tráfico.
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Formulario público de soporte: rate limit por IP (M3).
    location = /soporte/reportar-publico/ {
        limit_req zone=soporte_publico burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 50M;
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 50M;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    # Solo accesible vía X-Accel-Redirect desde Django (vista media_protegido).
    location /_protegido/ {
        internal;
        alias /app/media/;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
