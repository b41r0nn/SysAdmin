upstream django_backend {
    server django:8000;
}

# Este archivo se incluye dentro del bloque http de nginx; por eso estas
# directivas aplican globalmente a todos los server blocks.
server_tokens off;

# Límite de peticiones al formulario público de soporte (M3).
# Solo se limitan los POST (envío del formulario): cargar el formulario por GET
# no debe consumir el cupo. Con la clave vacía, nginx no aplica el límite.
# 5 req/min por IP con ráfaga de 3; corta el spam de scripts sin cookies.
map $request_method $soporte_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $soporte_limit_key zone=soporte_publico:10m rate=5r/m;

# HTTP → HTTPS (redirect)
server {
    listen 80;
    server_name _;
    return 301 https://$host:6060$request_uri;
}

# HTTPS interno (autofirmado, LAN)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Headers de seguridad.
    # X-Content-Type-Options, X-Frame-Options y Referrer-Policy los envía
    # Django para las respuestas dinámicas; aquí se dejan solo para static/media.
    # HSTS y una CSP mínima los añade nginx. La CSP no restringe scripts ni
    # estilos (las plantillas usan inline); solo bloquea embebido, plugins y
    # envío de formularios/base a otros orígenes.
    # X-XSS-Protection se quitó: está obsoleto y los navegadores lo ignoran.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Formulario público de soporte: rate limit por IP (M3).
    location = /soporte/reportar-publico/ {
        limit_req zone=soporte_publico burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 50M;
    }

    # Importar contraseñas desde Excel: el cuerpo trae las claves en texto plano.
    # Se recibe entero en memoria (por defecto nginx pasa a un archivo temporal en
    # disco todo cuerpo de más de 8 KB) y no se acepta nada más grande que lo que
    # Django guarda en memoria (FILE_UPLOAD_MAX_MEMORY_SIZE = 6 MB; el límite del
    # archivo es 5 MB). Solo esta ruta: el resto de subidas sigue igual.
    location ~ ^/passwords/vaults/\d+/credenciales/importar/$ {
        client_max_body_size 6m;
        client_body_buffer_size 6m;
        error_page 413 @importar_muy_grande;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location @importar_muy_grande {
        default_type "text/html; charset=utf-8";
        return 413 '<!doctype html><html lang="es"><meta charset="utf-8"><title>Archivo muy grande</title><p>El archivo pasa de 5 MB. <a href="$uri">Volver a importar</a></p></html>';
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 50M;
    }

    location /static/ {
        alias /app/staticfiles/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # Solo accesible vía X-Accel-Redirect desde Django (vista media_protegido).
    location /_protegido/ {
        internal;
        alias /app/media/;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
