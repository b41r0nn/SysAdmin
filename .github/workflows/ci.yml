name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff
        run: ruff check backend

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-secret-key-no-usar-en-produccion
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Check no pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: python manage.py check

      - name: Django deploy check
        env:
          DJANGO_SETTINGS_MODULE: sysadmin.settings.production
          SECRET_KEY: ci-secret-key-no-usar-en-produccion-0123456789abcdefghij
          PASSWORDS_ENCRYPTION_KEY: ci-fernet-key-placeholder
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          ALLOWED_HOSTS: localhost
          TRUSTED_ORIGINS: https://localhost
        run: python manage.py check --deploy --fail-level ERROR

      - name: Check management commands load
        run: |
          python manage.py help limpiar_historial >/dev/null
          python manage.py help sincronizar_software >/dev/null
          python manage.py help generar_notificaciones_mantenimiento >/dev/null

      - name: Tests with coverage
        run: |
          pip install coverage
          coverage run --source=. --omit='*/tests.py,*/migrations/*,manage.py' manage.py test --noinput
          coverage report --fail-under=70

  test-postgres:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-secret-key-no-usar-en-produccion
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      DJANGO_SETTINGS_MODULE: sysadmin.settings.local
      POSTGRES_DB: ci_db
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests (PostgreSQL)
        run: python manage.py test --noinput

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
