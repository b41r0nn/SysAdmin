name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-secret-key-no-usar-en-produccion
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: sqlite:///db_test.sqlite3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --noinput

      - name: Check management commands load
        run: |
          python manage.py help limpiar_historial >/dev/null
          python manage.py help sincronizar_software >/dev/null
          python manage.py help generar_notificaciones_mantenimiento >/dev/null
