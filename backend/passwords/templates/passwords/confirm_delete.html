{% extends "base.html" %}

{% block title %}{{ titulo }} — SysAdmin{% endblock %}

{% block content %}
<div class="sa-card p-4">
  <h4 class="fw-semibold mb-2">{{ titulo }}</h4>
  <p class="text-muted">{{ mensaje }}</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <a href="{% url volver_url **volver_kwargs %}" class="btn btn-outline-secondary">Cancelar</a>
    <button type="submit" class="btn btn-danger">Eliminar</button>
  </form>
</div>
{% endblock %}
