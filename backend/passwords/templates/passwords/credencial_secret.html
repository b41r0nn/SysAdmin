{% extends "base.html" %}

{% block title %}Secreto — SysAdmin{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Secreto</h1>
    <p class="page-subtitle">{{ credencial.titulo }} · {{ vault.nombre }}</p>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" href="{% url 'passwords:credenciales_lista' vault_id=vault.id %}">
      <i class="bi bi-arrow-left"></i> Volver
    </a>
  </div>
</div>

<div class="sa-card p-4">
  {% if requiere_codigo %}
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="col-12 col-md-6">
        <label class="form-label">Codigo de acceso</label>
        <input type="password" name="acceso_codigo" class="form-control" required>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Desbloquear</button>
      </div>
    </form>
  {% else %}
    <form method="post" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary">Ver secreto</button>
    </form>
  {% endif %}

  {% if secreto %}
    <div class="mt-4">
      <label class="form-label">Secreto</label>
      <div class="input-group">
        <input type="text" class="form-control" value="{{ secreto }}" readonly>
      </div>
    </div>
  {% endif %}
</div>
{% endblock %}
