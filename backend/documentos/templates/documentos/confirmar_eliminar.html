{% extends "base.html" %}

{% block title %}Eliminar documento — SysAdmin{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-4">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'documentos:lista' %}" class="text-decoration-none">Documentos</a></li>
    <li class="breadcrumb-item active">Eliminar</li>
  </ol>
</nav>

<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="sa-card p-4 text-center">
      <div class="mb-3 text-danger">
        <i class="bi bi-exclamation-triangle-fill display-4"></i>
      </div>
      <h5 class="fw-bold">¿Eliminar documento?</h5>
      <p class="text-muted">Se eliminará permanentemente <strong>«{{ documento.titulo }}»</strong> y su archivo adjunto.</p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
          <a href="{% url 'documentos:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-2"></i>Sí, eliminar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
