{% extends "base.html" %}

{% block title %}{{ titulo }} — SysAdmin{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-4">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a href="{% url 'core:dashboard' %}" class="text-decoration-none">Inicio</a></li>
    <li class="breadcrumb-item"><a href="{% url 'administracion:inicio' %}" class="text-decoration-none">Configuración</a></li>
    <li class="breadcrumb-item active">{{ titulo }}</li>
  </ol>
</nav>

<div class="sa-card p-5 text-center">
  <div class="sa-stat-icon bg-secondary bg-opacity-10 text-secondary mx-auto mb-3" style="width:56px;height:56px;">
    <i class="bi {{ icono }}"></i>
  </div>
  <h5 class="fw-bold mb-1">{{ titulo }}</h5>
  <p class="text-muted mb-0">Esta pantalla está en construcción.</p>
</div>
{% endblock %}
