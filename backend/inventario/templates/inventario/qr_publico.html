<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ activo.marca }} {{ activo.modelo }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      padding: 1rem;
    }
    .tarjeta {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icono {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      background: #0156A6;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 700;
    }
    .marca-modelo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.25rem;
      line-height: 1.2;
    }
    .tipo {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .serial {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.25rem;
      color: #0156A6;
      word-break: break-all;
      background: #f0f7ff;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
    }
    .serial-label {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <div class="icono">R</div>
    <div class="marca-modelo">{{ activo.marca }} {{ activo.modelo }}</div>
    <div class="tipo">{{ activo.get_tipo_dispositivo_display }}</div>
    <div class="serial-label">Serial</div>
    <div class="serial">{{ activo.serial }}</div>
    <div class="footer">REDIHOS S.A.S · Activo corporativo</div>
  </div>
</body>
</html>
