<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Etiquetas QR — SysAdmin</title>
  <style>
    /* ─── Reset + Página ───────────────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #1e293b;
      background: #fff;
    }

    /* ─── Etiqueta ────────────────────────────────────────────────────── */
    .label {
      display: inline-block;
      width: 50mm;
      height: 30mm;
      border: 1px solid #94a3b8;
      border-radius: 2mm;
      padding: 2mm 2.4mm;
      margin: 0 3mm 4mm 0;
      vertical-align: top;
      page-break-inside: avoid;
    }

    .label-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a56db;
      padding-bottom: 0.8mm;
      margin-bottom: 1mm;
    }

    .label-logo {
      height: 5.5mm;
      width: auto;
    }

    .label-brand {
      text-align: right;
      font-size: 3.9pt;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #64748b;
      line-height: 1.35;
    }

    .label-brand strong {
      display: block;
      font-size: 6.4pt;
      letter-spacing: .02em;
      color: #0f172a;
    }

    .label-body {
      display: flex;
      gap: 3.5mm;
      align-items: center;
      justify-content: center;
    }

    .qr {
      width: 14mm;
      height: 14mm;
      flex-shrink: 0;
    }

    .qr img {
      width: 100%;
      height: 100%;
    }

    .data {
      font-size: 5.2pt;
      line-height: 1.25;
      flex: 0 1 auto;
    }

    .data .field { margin-bottom: 0.6mm; }

    .data .field:last-child { margin-bottom: 0; }

    .k {
      display: block;
      font-size: 3.9pt;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #64748b;
    }

    .data .serial {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 6pt;
      color: #0f172a;
    }

    .label-footer {
      margin-top: 0.8mm;
      border-top: 0.5px solid #e2e8f0;
      padding-top: 0.5mm;
      text-align: center;
      font-size: 4.6pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #0156a6;
    }
  </style>
</head>
<body>
  {% for l in labels %}
  <div class="label">
    <div class="label-header">
      <img class="label-logo" src="file://{{ l.logo_path }}" alt="{{ l.config.nombre_empresa }}">
      <div class="label-brand">Activo fijo No.<strong>{{ l.numero_interno|default:"—" }}</strong></div>
    </div>
    <div class="label-body">
      <div class="qr"><img src="{{ l.qr }}" alt="Código QR"></div>
      <div class="data">
        <div class="field">
          <span class="k">Serial</span>
          <span class="serial">{{ l.serial }}</span>
        </div>
        <div class="field">
          <span class="k">Equipo</span>
          {{ l.marca }} {{ l.modelo }}
        </div>
        <div class="field">
          <span class="k">Tipo</span>
          {{ l.tipo }}
        </div>
      </div>
    </div>
    <div class="label-footer">{{ l.config.nombre_empresa }}{% if l.config.nit %} · NIT {{ l.config.nit }}{% endif %}</div>
  </div>
  {% endfor %}
</body>
</html>
